name: Publish NuGet

# Builds the SPA and publishes the VpnHood.AppLib.Assets.ClassicSpa nuget. One repo holds both, so
# this is fully self-contained — no cross-repo clone, and it does NOT call the shared VpnHood publish
# module (there is only one SPA; generalizing that into the monorepo would be pointless).
#
# CI OWNS the release, like the monorepo's Invoke-VersionBump: it bumps, translates, commits the
# result back, then builds and packs. Because it is the same repo, the default GITHUB_TOKEN
# (contents: write) does every push — no PAT anywhere.
#
# Dispatch-only: nothing publishes on a push. A developer runs _publish.ps1 (thin trigger); their own
# `gh` fires this on develop.
#
#   prerelease=true  -> commit clean X.Y.Z on develop, publish X.Y.Z-prerelease
#   prerelease=false -> commit clean X.Y.Z on develop, fast-forward main, publish X.Y.Z
#
# Order: bump -> translate -> commit + push (develop, then ff main on stable) -> build SPA -> pack.
# Bump+translate BEFORE the commit so the published bundle matches exactly what lands in the repo;
# build AFTER the commit so it embeds the fresh locales.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish X.Y.Z-prerelease instead of the stable X.Y.Z (stable also fast-forwards main)"
        type: boolean
        required: false
        default: true

jobs:
  publish:
    # Only the canonical repo publishes the shared package id; forks push nothing.
    if: github.repository_owner == 'vpnhood'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # bump + translated locales are committed back via GITHUB_TOKEN
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # the branch, not the detached SHA, so the bump can push back
          fetch-depth: 0                # need history to fast-forward main
          persist-credentials: true     # GITHUB_TOKEN drives the pushes
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "10.0.x" }
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          ./pub/Bump-SpaVersion.ps1
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Translate locales
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)) { throw "GEMINI_API_KEY is not set." }
          dotnet tool install --global VpnHood.Tools.ResourceTranslator
          $env:PATH = "$env:PATH" + [IO.Path]::PathSeparator + (Join-Path $HOME ".dotnet/tools")
          vhtranslator --base "src/locales/en.json" -m "gemini-flash-lite-latest"
          if ($LASTEXITCODE -gt 0) { throw "translation failed (exit $LASTEXITCODE)." }

      - name: Commit and push the release
        shell: pwsh
        run: |
          $version = "${{ steps.bump.outputs.version }}"
          # Version files always change; locales may or may not. Stage both; the version bump
          # guarantees the commit is never empty.
          git add package.json package-lock.json Directory.Build.props src/locales
          git commit -m "Publish SPA $version"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed (exit $LASTEXITCODE)." }
          git push origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw "git push failed (exit $LASTEXITCODE)." }
          # Stable release also advances main — fast-forward only, never --force.
          if ('${{ inputs.prerelease }}' -ne 'true') {
            git push origin "HEAD:main"
            if ($LASTEXITCODE -ne 0) { throw "fast-forward of main failed (exit $LASTEXITCODE) — reconcile by hand." }
          }

      # Build AFTER the commit so the bundle embeds the freshly translated locales.
      - name: Build SPA bundle
        shell: pwsh
        run: ./pub/Build-Spa.ps1 -noInstall

      - name: Pack and push
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw "NUGET_API_KEY is not set." }
          $base = "${{ steps.bump.outputs.version }}"
          # Prerelease appends the suffix to the NUGET only; the committed number stays clean.
          $nugetVersion = if ('${{ inputs.prerelease }}' -eq 'true') { "$base-prerelease" } else { $base }
          Write-Host "Packing VpnHood.AppLib.Assets.ClassicSpa $nugetVersion"

          $packDir = "pub/bin/nuget"
          Remove-Item $packDir -Recurse -Force -ErrorAction Ignore
          dotnet pack nuget/VpnHood.AppLib.Assets.ClassicSpa/VpnHood.AppLib.Assets.ClassicSpa.csproj `
            -c Release -o $packDir -p:Version=$nugetVersion `
            -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          if ($LASTEXITCODE -gt 0) { throw "dotnet pack failed (exit $LASTEXITCODE)." }

          # Pushing a .nupkg also pushes its adjacent .snupkg symbols.
          foreach ($pkg in Get-ChildItem $packDir -Filter *.nupkg) {
            dotnet nuget push $pkg.FullName --source "https://api.nuget.org/v3/index.json" `
              --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -gt 0) { throw "nuget push failed for $($pkg.Name) (exit $LASTEXITCODE)." }
          }
          Write-Host "Published VpnHood.AppLib.Assets.ClassicSpa $nugetVersion" -ForegroundColor Green
